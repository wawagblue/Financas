services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE no .env}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - api-database

  api:
    build:
      context: .
      dockerfile: services/finance-api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Financas: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:?Defina MYSQL_DATABASE no .env};User=${MYSQL_USER:?Defina MYSQL_USER no .env};Password=${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}"
      Database__AplicarMigracoesAoIniciar: "true"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_ISSUER: ${JWT_ISSUER:-TccProway}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-TccProway.Client}
      ServicosExternos__Auth__BaseUrl: ${AUTH_URL:?Defina AUTH_URL com endereço HTTPS}
      ServicosExternos__IaWhatsApp__BaseUrl: ${IA_WHATSAPP_URL:?Defina IA_WHATSAPP_URL com endereço HTTPS}
      ServicosExternos__OpenFinance__BaseUrl: ${OPEN_FINANCE_URL:?Defina OPEN_FINANCE_URL com endereço HTTPS}
      ReverseProxy__Clusters__auth__Destinations__principal__Address: ${AUTH_URL:?Defina AUTH_URL com endereço HTTPS}
      ReverseProxy__Clusters__ia-whatsapp__Destinations__principal__Address: ${IA_WHATSAPP_URL:?Defina IA_WHATSAPP_URL com endereço HTTPS}
      ReverseProxy__Clusters__open-finance__Destinations__principal__Address: ${OPEN_FINANCE_URL:?Defina OPEN_FINANCE_URL com endereço HTTPS}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:4200}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORTA:-8081}:8080"
    networks:
      - frontend-api
      - api-database

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORTA:-4200}:80"
    networks:
      - frontend-api

volumes:
  mysql-data:

networks:
  frontend-api:
    driver: bridge
  api-database:
    driver: bridge
    internal: true
